services:
  postgres:
    image: postgres:16-alpine
    container_name: school_admission_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_admission
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend_primary
    restart: unless-stopped
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Include Error Detail=true"
      HOLD_DURATION_SECONDS: "600"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend-secondary:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend_secondary
    restart: unless-stopped
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Include Error Detail=true"
      HOLD_DURATION_SECONDS: "600"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: school_admission_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: school_admission_postgres_data
